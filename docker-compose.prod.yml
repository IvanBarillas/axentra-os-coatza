services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - axentra_prod

  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_ENV: prod
    ports:
      - "8000:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - axentra_prod

volumes:
  postgres_prod_data:
  static_data:
  media_data:
  logs_data:

networks:
  axentra_prod:
