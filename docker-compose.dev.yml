services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - axentra_dev

  web:
    build:
      context: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DJANGO_ENV: docker
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - axentra_dev

volumes:
  postgres_dev_data:

networks:
  axentra_dev:
