<!-- templates/layouts/dashboard_layout.html -->
{% extends "base.html" %}

{% block content %}
<div x-data="{ sidebarOpen: false }" class="min-h-screen bg-gray-50 flex w-full">
    
    <!-- 📱 MENÚ LATERAL RESPONSIVO (EXCLUSIVO PARA MÓVILES) -->
    <div x-show="sidebarOpen" class="relative z-50 lg:hidden" role="dialog" aria-modal="true" x-cloak>
        <div x-show="sidebarOpen" 
             x-transition:enter="transition-opacity ease-linear duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-linear duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-gray-900/80"></div>

        <div class="fixed inset-0 flex">
            <div x-show="sidebarOpen" 
                 x-transition:enter="transition ease-in-out duration-300 transform"
                 x-transition:enter-start="-translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in-out duration-300 transform"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="-translate-x-full"
                 @click.away="sidebarOpen = false"
                 class="relative mr-16 flex w-full max-w-xs flex-1">
                
                <div class="absolute top-0 left-full flex w-16 justify-center pt-5">
                    <button type="button" class="-m-2.5 p-2.5 text-white cursor-pointer" @click="sidebarOpen = false">
                        <i data-lucide="x" class="h-6 w-6"></i>
                    </button>
                </div>
                {% include "partials/_sidebar.html" %}
            </div>
        </div>
    </div>

    <!-- 🖥️ SIDEBAR FIJO PARA PANTALLAS GRANDES -->
    <div class="hidden lg:fixed lg:inset-y-0 lg:z-50 lg:flex lg:w-72 lg:flex-col h-full">
        {% include "partials/_sidebar.html" %}
    </div>

    <!-- 🎰 CHASSIS CENTRAL DE TRABAJO (ALINEADO FLUIDO) -->
    <div class="lg:pl-72 flex flex-col flex-1 min-w-0">
        
        <!-- Navbar Superior Acoplada -->
        {% include "partials/_navbar.html" %}

        <!-- Espacio soberano para el renderizado del negocio -->
        <main class="flex-1 py-8">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 animate-fade-in" id="main-content-target">
                {% block dashboard_content %}{% endblock %}
            </div>
        </main>

        <!-- Pie de Página Centrado en la Retícula -->
        {% include "partials/_footer.html" %}
    </div>
</div>
{% endblock %}
