<header class="rounded-2xl border border-gray-200/80 bg-white px-5 py-4 shadow-sm sm:px-6">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex min-w-0 items-start gap-3">
            <div class="hidden h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-gray-950 text-white shadow-sm sm:flex"><i data-lucide="{{ icon|default:'square-pen' }}" class="h-5 w-5"></i></div>
            <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2"><span class="inline-flex items-center rounded-md border border-indigo-100 bg-indigo-50 px-2 py-0.5 font-mono text-xs font-black uppercase tracking-[.18em] text-indigo-700">{{ module_label }}</span>{% if mode_label %}<span class="inline-flex items-center rounded-md border border-amber-100 bg-amber-50 px-2 py-0.5 font-mono text-xs font-black uppercase tracking-[.18em] text-amber-700">{{ mode_label }}</span>{% endif %}</div>
                <h1 class="mt-2 text-xl font-black uppercase leading-none tracking-tight text-gray-950">{{ title }}</h1>
                {% if description %}<p class="mt-2 max-w-3xl text-xs font-medium leading-relaxed text-gray-500">{{ description }}</p>{% endif %}
            </div>
        </div>
        {% if back_url %}<a href="{{ back_url }}" hx-get="{{ back_hx_url|default:back_url }}" hx-target="{{ back_target|default:'#page-content' }}" hx-swap="innerHTML" hx-push-url="{% if push_url %}{{ push_url }}{% else %}true{% endif %}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-xs font-black uppercase tracking-widest text-gray-600 transition hover:border-gray-300 hover:bg-gray-50 hover:text-gray-950"><i data-lucide="arrow-left" class="h-4 w-4 text-gray-400"></i>{{ back_label|default:'Volver' }}</a>{% endif %}
    </div>
</header>
