<header class="sticky top-0 z-40 flex h-16 shrink-0 items-center gap-x-4 border-b border-gray-200 bg-white px-4 shadow-sm sm:gap-x-6 sm:px-6 lg:px-8">
    <button type="button" class="-m-2.5 p-2.5 text-gray-700 lg:hidden" @click="sidebarOpen = true">
        <span class="sr-only">Abrir barra lateral</span>
        <i data-lucide="menu" class="h-6 w-6"></i>
    </button>

    <div class="h-6 w-px bg-gray-200 lg:hidden" aria-hidden="true"></div>

    <div class="flex flex-1 gap-x-4 self-stretch lg:gap-x-6">
        <div class="relative flex flex-1 items-center">
            <span class="inline-flex items-center gap-x-1.5 rounded-md bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/20">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
                Axentra Core Activo
            </span>
        </div>
        
        <div class="flex items-center gap-x-4 lg:gap-x-6">
            <button type="button" class="-m-2.5 p-2.5 text-gray-400 hover:text-gray-500">
                <span class="sr-only">Ver notificaciones</span>
                <i data-lucide="bell" class="h-6 w-6"></i>
            </button>

            <div class="hidden lg:block lg:h-6 lg:w-px lg:bg-gray-200" aria-hidden="true"></div>

            <div class="relative">
                <button type="button" class="-m-1.5 flex items-center p-1.5" id="user-menu-button">
                    <span class="hidden lg:flex lg:items-center">
                        <span class="ml-4 text-sm font-semibold aria-hidden="true" class="text-gray-900">
                            {{ request.user.username|default:"Usuario Corporativo" }}
                        </span>
                        <i data-lucide="chevron-down" class="ml-2 h-4 w-4 text-gray-400"></i>
                    </span>
                </button>
            </div>
        </div>
    </div>
</header>
