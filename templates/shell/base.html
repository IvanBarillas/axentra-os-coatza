{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full scroll-smooth bg-gray-50 text-[14px] md:text-[15px] lg:text-[16px]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ tenant.app_name|default:"Axentra OS" }}{% endblock %}</title>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
        @theme {
            --ax-primary: #0a192f;
            --ax-secondary: #1e3a8a;
            --ax-accent: #2563eb;
            --ax-success: #059669;
            --ax-warning: #d97706;
            --ax-danger: #dc2626;
            --font-sans: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
        }
        [x-cloak] { display: none !important; }
        .animate-fade-in { animation: fadeIn .25s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body class="h-full bg-gray-50 font-sans antialiased" hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>

<div id="app-shell" class="flex h-screen overflow-hidden">
    {% include "navigation/global_sidebar.html" %}

    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
        {% include "partials/navbar.html" %}

        <main id="workbench" class="flex-1 overflow-hidden">
            {% block workbench %}{% endblock %}
        </main>
    </div>
</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root"></div>
<div id="overlay-root"></div>

<script src="{% static 'js/htmx.min.js' %}" defer></script>
<script src="{% static 'js/alpine.min.js' %}" defer></script>
<script src="{% static 'js/lucide.min.js' %}"></script>
<script src="{% static 'js/chart.umd.js' %}" defer></script>

<script>
    function bootIcons() {
        if (window.lucide) { lucide.createIcons(); }
    }
    document.addEventListener("DOMContentLoaded", bootIcons);
    document.body.addEventListener("htmx:afterSwap", bootIcons);
    document.body.addEventListener("htmx:historyRestore", bootIcons);

    // HTMX GLOBAL EVENTS
    document.body.addEventListener("htmx:beforeRequest", function() {
        document.body.classList.add("cursor-progress");
    });
    document.body.addEventListener("htmx:afterRequest", function() {
        document.body.classList.remove("cursor-progress");
    });

    // APPLICATION EVENTS
    document.body.addEventListener("moduleChanged", function(e) {
        console.log("Module:", e.detail);
    });
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
