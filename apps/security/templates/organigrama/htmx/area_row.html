<article id="area-row-{{ area.id }}" class="px-5 sm:px-6 lg:px-7 py-4 hover:bg-gray-50/60 transition" x-show="buscarQuery === '' || '{{ area.nombre }}'.toUpperCase().includes(buscarQuery.toUpperCase()) || '{{ area.dependencia.nombre }}'.toUpperCase().includes(buscarQuery.toUpperCase()) || '{{ area.sede_fisica.nombre }}'.toUpperCase().includes(buscarQuery.toUpperCase())">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-start gap-3 min-w-0">
            <div class="w-11 h-11 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 shrink-0">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
                <a
    href="{% url 'organigrama:area_detail' area.id %}"
    hx-get="{% url 'organigrama:area_detail' area.id %}"
    hx-target="#workbench"
    hx-swap="innerHTML"
    hx-push-url="true"
    class="block text-sm font-black text-indigo-600 hover:text-indigo-800 uppercase font-mono tracking-tight truncate"
>
    {{ area.nombre }}
</a>
                <p class="mt-1 text-xs text-gray-400 font-bold uppercase tracking-widest font-mono truncate">
                    {{ area.dependencia.nombre|default:"Sin dependencia" }}
                </p>
                <div class="mt-2 flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-gray-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-gray-500 font-mono">
                        <i data-lucide="building-2" class="w-3 h-3 text-gray-400"></i>
                        {{ area.dependencia.nombre|default:"Sin dependencia" }}
                    </span>
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-gray-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-gray-500 font-mono">
                        <i data-lucide="map-pin" class="w-3 h-3 text-gray-400"></i>
                        {{ area.sede_fisica.nombre|default:"Sin sede" }}
                    </span>
                    {% if area.is_active %}
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-emerald-700 font-mono">
                            <i data-lucide="circle-check" class="w-3 h-3"></i>
                            Activa
                        </span>
                    {% else %}
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-rose-200 bg-rose-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-rose-700 font-mono">
                            <i data-lucide="circle-x" class="w-3 h-3"></i>
                            Inactiva
                        </span>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2 shrink-0">
            <a
    href="{% url 'organigrama:area_detail' area.id %}"
    hx-get="{% url 'organigrama:area_detail' area.id %}"
    hx-target="#workbench"
    hx-swap="innerHTML"
    hx-push-url="true"
    class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-black uppercase tracking-widest text-gray-500 hover:text-indigo-700 hover:border-indigo-200 transition font-mono"
>
    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
    Abrir Expediente
</a>
        </div>
    </div>
</article>
