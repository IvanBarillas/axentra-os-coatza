<article id="dependencia-row-{{ dep.id }}" class="px-5 sm:px-6 lg:px-7 py-4 hover:bg-gray-50/60 transition" x-show="buscarQuery === '' || '{{ dep.nombre }}'.toUpperCase().includes(buscarQuery.toUpperCase()) || '{{ dep.slug }}'.toUpperCase().includes(buscarQuery.toUpperCase()) || '{{ dep.encargado_departamento }}'.toUpperCase().includes(buscarQuery.toUpperCase())">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-start gap-3 min-w-0">
            <div class="w-11 h-11 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 shrink-0">
                <i data-lucide="building-2" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
                <a href="{% url 'organigrama:dependencia_detail' dep.id %}" hx-get="{% url 'organigrama:dependencia_detail' dep.id %}" hx-target="#workbench" hx-swap="innerHTML" hx-push-url="true" class="block text-sm font-black text-indigo-600 hover:text-indigo-800 uppercase font-mono tracking-tight truncate">
                    {{ dep.nombre }}
                </a>
                <p class="mt-1 text-xs text-gray-400 font-bold uppercase tracking-widest font-mono truncate">
                    {{ dep.slug|default:"sin-slug" }}
                </p>
                <div class="mt-2 flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-gray-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-gray-500 font-mono">
                        <i data-lucide="layout-grid" class="w-3 h-3 text-gray-400"></i>
                        {{ dep.total_areas|default:0 }} área(s)
                    </span>
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-gray-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-gray-500 font-mono">
                        <i data-lucide="map-pin" class="w-3 h-3 text-gray-400"></i>
                        {{ dep.total_sedes|default:0 }} sede(s)
                    </span>
                    {% if dep.is_active %}
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-emerald-700 font-mono">
                            <i data-lucide="circle-check" class="w-3 h-3"></i>
                            Activa
                        </span>
                    {% else %}
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-rose-200 bg-rose-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-rose-700 font-mono">
                            <i data-lucide="circle-x" class="w-3 h-3"></i>
                            Inactiva
                        </span>
                    {% endif %}
                    {% if dep.total_areas %}
                        <span class="inline-flex items-center gap-1.5 rounded-full border border-amber-200 bg-amber-50 px-2.5 py-1 text-xs font-black uppercase tracking-widest text-amber-700 font-mono">
                            <i data-lucide="shield-alert" class="w-3 h-3"></i>
                            Operación vinculada
                        </span>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-2 shrink-0">
            <a href="{% url 'organigrama:dependencia_detail' dep.id %}" hx-get="{% url 'organigrama:dependencia_detail' dep.id %}" hx-target="#workbench" hx-swap="innerHTML" hx-push-url="true" class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-black uppercase tracking-widest text-gray-500 hover:text-indigo-700 hover:border-indigo-200 transition font-mono">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                Abrir Expediente
            </a>
        </div>
    </div>
</article>
