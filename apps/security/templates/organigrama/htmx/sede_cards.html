<div class="max-h-[68vh] overflow-y-auto overscroll-contain pr-1 [scrollbar-gutter:stable]">
<div class="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-6 xl:grid-cols-3">
    {% for sede in sedes %}
        {% include "organigrama/htmx/sede_card.html" %}
    {% empty %}
        <div class="col-span-full text-center py-16 bg-white border border-gray-200 rounded-[24px] md:rounded-[32px] p-6 max-w-md mx-auto shadow-3xs font-mono">
            <div class="w-12 h-12 bg-gray-50 border border-gray-100 rounded-xl flex items-center justify-center mx-auto mb-3 text-gray-400">
                <i data-lucide="map" class="w-5 h-5 stroke-1"></i>
            </div>

            <span class="text-xs font-black text-gray-950 uppercase tracking-widest block">
                Sin sedes registradas
            </span>

            <p class="text-xs text-gray-400 font-medium mt-1 uppercase leading-relaxed">
                Agrega la primera sede para comenzar a organizar las ubicaciones institucionales.
            </p>
        </div>
    {% endfor %}
</div>
</div>

<script>
    if (typeof lucide !== "undefined") {
        lucide.createIcons();
    }
</script>
