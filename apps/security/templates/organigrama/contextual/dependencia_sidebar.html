<aside class="flex h-full w-full flex-col bg-white">
    <div class="border-b border-gray-100 p-5">
        <div class="flex items-start gap-3">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl border border-indigo-100 bg-indigo-50 text-indigo-600"><i data-lucide="building-2" class="h-5 w-5"></i></div>
            <div class="min-w-0">
                <p class="font-mono text-xs font-black uppercase tracking-[0.18em] text-gray-500">Expediente de Dependencia</p>
                <h2 class="mt-1 truncate text-sm font-black leading-tight text-gray-950">{{ dependencia.nombre }}</h2>
                <p class="mt-1 truncate font-mono text-xs font-bold uppercase tracking-widest text-gray-500">{{ dependencia.slug|default:"sin-slug" }}</p>
            </div>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-2">
            <div class="rounded-2xl border border-gray-100 bg-gray-50/70 p-3">
                <p class="font-mono text-xs font-black uppercase tracking-widest text-gray-500">Estado</p>
                <p class="mt-1 font-mono text-xs font-black uppercase {% if dependencia.is_active %}text-emerald-700{% else %}text-rose-700{% endif %}">{% if dependencia.is_active %}Activa{% else %}Inactiva{% endif %}</p>
            </div>
            <div class="rounded-2xl border border-gray-100 bg-gray-50/70 p-3">
                <p class="font-mono text-xs font-black uppercase tracking-widest text-gray-500">Áreas</p>
                <p class="mt-1 font-mono text-xs font-black uppercase text-gray-950">{{ total_areas|default:0 }}</p>
            </div>
        </div>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
        {% for item in detail_menu %}
            <a href="{{ item.href }}" hx-get="{{ item.href }}" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true" class="flex min-h-11 items-center gap-3 rounded-2xl px-4 py-3 transition group {% if item.active %}bg-gray-950 text-white{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-950{% endif %}">
                <i data-lucide="{{ item.icon }}" class="h-4 w-4 shrink-0 {% if item.active %}text-white{% else %}text-gray-500 group-hover:text-gray-700{% endif %}"></i>
                <span class="truncate font-mono text-xs font-black uppercase tracking-widest">{{ item.title }}</span>
            </a>
        {% endfor %}
    </nav>

    <div class="border-t border-gray-100 p-3">
        <a href="{% url 'organigrama:dependencia_list' %}" hx-get="{% url 'organigrama:dependencia_list' %}" hx-target="#workbench" hx-swap="innerHTML" hx-push-url="true" class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-3 font-mono text-xs font-black uppercase tracking-widest text-gray-600 transition hover:border-gray-300 hover:text-gray-950">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>Volver a Dependencias
        </a>
    </div>
</aside>

<script>if (typeof lucide !== "undefined") { lucide.createIcons(); }</script>
