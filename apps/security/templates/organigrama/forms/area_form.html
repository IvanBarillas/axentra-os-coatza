<form method="POST" action="{% url 'organigrama:area_create' %}" class="p-6 space-y-5">
    {% csrf_token %}
    
    <div class="space-y-4 text-sm">
        {% for field in form %}
        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">{{ field.label }}</label>
            <div class="relative rounded-xl">
                {{ field }}
            </div>
            {% if field.errors %}
                <span class="text-xs font-semibold text-rose-600 mt-0.5 flex items-center gap-1">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> {{ field.errors.0 }}
                </span>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
        <button type="button" @click="openModal = false" class="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition cursor-pointer">
            Cancelar Alta
        </button>
        <button type="submit" class="px-5 py-2.5 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-xs transition cursor-pointer">
            Vincular Oficina
        </button>
    </div>
</form>

<script>
    if (window.lucide && typeof lucide.createIcons === 'function') { lucide.createIcons(); }
</script>
