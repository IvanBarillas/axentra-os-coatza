{% extends "base.html" %}

{% block dashboard_content %}
<div class="flex flex-col md:flex-row w-full h-full gap-6 animate-fade-in font-mono text-left select-none">
    
    <div class="w-full md:w-68 shrink-0 bg-white border border-gray-200/80 rounded-2xl p-4 flex flex-col justify-between shadow-4xs"
         x-data="{ currentTab: 'identidad' }">
        
        <div class="space-y-4">
            <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-center">
                <div class="w-12 h-12 bg-gray-950 text-white rounded-xl mx-auto flex items-center justify-center font-black text-sm uppercase shadow-sm">
                    {{ funcionario.username|slice:":2"|upper }}
                </div>
                <h4 class="text-xs font-black text-gray-800 uppercase tracking-tight mt-2 truncate">
                    {{ funcionario.get_full_name|default:funcionario.username }}
                </h4>
                <span class="text-[9px] font-bold text-gray-400 block mt-0.5 truncate lowercase">
                    {{ funcionario.email }}
                </span>
            </div>

            <nav class="space-y-1 text-[11px] font-bold uppercase tracking-tight">
                <button @click="currentTab = 'identidad'"
                        hx-get="{% url 'accounts:funcionario_sub_identidad' funcionario.id %}" 
                        hx-target="#entity-sub-content"
                        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl border transition-all text-left cursor-pointer outline-none"
                        :class="currentTab === 'identidad' ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'text-gray-600 hover:bg-gray-50 border-transparent'">
                    <i data-lucide="user" class="w-3.5 h-3.5"></i> Identidad Core
                </button>

                <button @click="currentTab = 'hardware'"
                        hx-get="{% url 'accounts:funcionario_sub_hardware' funcionario.id %}" 
                        hx-target="#entity-sub-content"
                        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl border transition-all text-left cursor-pointer outline-none"
                        :class="currentTab === 'hardware' ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'text-gray-600 hover:bg-gray-50 border-transparent'">
                    <i data-lucide="monitor" class="w-3.5 h-3.5"></i> Hardware Asignado
                </button>

                <button @click="currentTab = 'telefonia'"
                        hx-get="{% url 'accounts:funcionario_sub_telefonia' funcionario.id %}" 
                        hx-target="#entity-sub-content"
                        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl border transition-all text-left cursor-pointer outline-none"
                        :class="currentTab === 'telefonia' ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'text-gray-600 hover:bg-gray-50 border-transparent'">
                    <i data-lucide="phone" class="w-3.5 h-3.5"></i> Extensiones y Voz
                </button>
            </nav>
        </div>

        <div class="mt-6 pt-4 border-t border-gray-100">
            <a href="#" class="flex items-center justify-center gap-2 px-3 py-2 border border-gray-200 rounded-xl text-[10px] font-black uppercase text-gray-500 hover:bg-gray-50 transition shadow-4xs cursor-pointer">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Volver a Lista
            </a>
        </div>
    </div>

    <div class="flex-1 bg-white border border-gray-200/80 rounded-2xl p-6 shadow-4xs" id="entity-sub-content">
        {% include "contextual/partials/sub_identidad.html" %}
    </div>

</div>

<script>
    // Inicialización forzada de iconos de Lucide tras cargas de HTMX
    if (typeof lucide !== 'undefined') { lucide.createIcons(); }
</script>
{% endblock %}
