<aside class="w-full lg:w-60 shrink-0 bg-white border border-gray-200/80 rounded-2xl p-3 flex flex-col justify-between shadow-4xs font-mono">
    <div class="space-y-3">
        <div class="px-2 py-1.5 bg-slate-50 border border-slate-100 rounded-xl flex items-center justify-between">
            <span class="text-xs font-black text-slate-700 uppercase tracking-tight">Menú Aplicación</span>
            <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50/60 px-1.5 py-0.5 rounded-md uppercase">ACCOUNTS</span>
        </div>

        <nav class="space-y-1 text-xs font-bold uppercase tracking-tight">
            {% for boton in menu_actual %}
                <a href="{% url boton.url %}" 
                   hx-get="{% url boton.url %}" 
                   hx-target="#main-content-target"
                   hx-push-url="true"
                   class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl border transition-all text-left outline-none group
                          {% if request.resolver_match.url_name == 'accounts_dashboard' and boton.name == 'Dashboard Analítico' or request.resolver_match.url_name == 'funcionario_list' and boton.name == 'Padrón de Empleados' %}
                              text-indigo-600 bg-indigo-50/50 border-transparent
                          {% else %}
                              border border-transparent text-gray-600 hover:bg-slate-50 hover:text-gray-900
                          {% endif %}">
                    <i data-lucide="{{ boton.icon|default:'circle' }}" class="w-4 h-4 shrink-0 {% if request.resolver_match.url_name == 'accounts_dashboard' and boton.name == 'Dashboard Analítico' %}text-indigo-500{% else %}text-gray-400 group-hover:text-gray-700{% endif %}"></i> 
                    <span class="truncate">{{ boton.name }}</span>
                </a>
            {% endfor %}
        </nav>
    </div>
    <div class="mt-4 pt-2 border-t border-gray-100 text-[9px] font-bold text-gray-400 tracking-wider text-center uppercase">
        ACCOUNTS // CORE
    </div>
</aside>
