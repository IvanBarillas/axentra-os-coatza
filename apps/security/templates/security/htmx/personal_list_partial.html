<div id="personal-list-container" class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex flex-col h-[520px]">
    <div class="flex items-center justify-between mb-4 shrink-0">
        <div class="text-xs font-mono uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
            <i data-lucide="users" class="w-3.5 h-3.5"></i> 1. Personal Autorizado
        </div>
        <span class="text-xs font-mono font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">
            {{ personal_autorizado|length }}
        </span>
    </div>

    <div class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
        {% for item in personal_autorizado %}
            <div class="relative group/tarjeta flex items-center w-full min-w-0">
                
                <button type="button"
                        hx-get="{% url 'security:cargar_permisos_usuario' item.usuario.id app.id %}"
                        hx-target="#permisos-matrix-container"
                        hx-swap="outerHTML"
                        class="flex-1 flex items-center justify-between p-3 rounded-2xl transition border duration-150 min-w-0 text-left
                               {% if item.usuario.id == usuario_seleccionado.id %} bg-slate-950 border-slate-950 text-white shadow-md {% elif item.is_suspended %} bg-gray-100/70 border-gray-200 text-gray-400 opacity-60 line-through {% else %} bg-white border-slate-100 text-slate-800 hover:bg-slate-50 {% endif %}">
                    
                    <div class="flex items-center gap-3 truncate pr-10 min-w-0">
                        <div class="w-8 h-8 rounded-xl font-mono font-black text-xs flex items-center justify-center shrink-0 {% if item.is_suspended %} bg-gray-300 text-gray-600 {% else %} bg-slate-100 text-slate-700 {% endif %}">
                            {{ item.usuario.first_name|slice:":1"|upper }}
                        </div>
                        <div class="truncate min-w-0">
                            <div class="font-bold text-xs truncate uppercase">{{ item.usuario.full_name }}</div>
                            <div class="text-xs font-mono truncate mt-0.5 text-slate-400">{{ item.usuario.email }}</div>
                        </div>
                    </div>
                    
                    <div class="shrink-0 pl-1">
                        <span class="text-xs font-black font-mono uppercase px-1.5 py-0.5 rounded {% if item.is_suspended %} bg-red-100 text-red-700 {% else %} bg-slate-100 text-slate-700 {% endif %}">
                            {% if item.is_suspended %}SUSP{% else %}{{ item.rol_actual }}{% endif %}
                        </span>
                    </div>
                </button>

                <div class="absolute right-3 opacity-0 group-hover/tarjeta:opacity-100 flex items-center gap-1 transition-all duration-150 z-10 p-1">
                    <button type="button" 
                            hx-post="{% url 'security:toggle_user_modulo_active' item.usuario.id app.id %}"
                            hx-target="#personal-list-container"
                            hx-swap="outerHTML"
                            class="p-1 rounded bg-slate-100 hover:bg-slate-200 transition text-slate-600">
                        <i data-lucide="power" class="w-3 h-3"></i>
                    </button>
                </div>
            </div>
        {% empty %}
            <div class="text-center py-12 text-slate-400 font-mono text-xs">Sin personal asignado en este nodo.</div>
        {% endfor %}
    </div>
</div>
<script>if (typeof lucide !== 'undefined') { lucide.createIcons(); }</script>
