{% load axentra_ui %}

<aside class="flex h-full w-full flex-col bg-white text-slate-900">
    <div class="border-b border-slate-200 px-5 py-5">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-950 text-white shadow-sm"><i data-lucide="settings" class="h-5 w-5"></i></div>
            <div class="min-w-0">
                <p class="font-mono text-xs font-black uppercase tracking-[0.22em] text-slate-500">Axentra Core</p>
                <h2 class="truncate font-mono text-sm font-black uppercase tracking-tight text-slate-950">Configuración</h2>
            </div>
        </div>
        <p class="mt-3 font-mono text-xs font-bold uppercase leading-relaxed tracking-wide text-slate-500">Identidad institucional, municipio activo y parámetros oficiales del sistema.</p>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-4 py-4 font-mono">
        {% url 'security:tenant_config' as tenant_config_url %}
        <a href="{{ tenant_config_url }}" hx-get="{{ tenant_config_url }}" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true" class="group flex min-h-11 items-center gap-3 rounded-xl px-3 py-3 text-xs font-black uppercase tracking-widest transition {% if current_configuration_view == 'security:tenant_config' %}bg-slate-950 text-white shadow-sm{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-950{% endif %}">
            <i data-lucide="landmark" class="h-4 w-4 {% if current_configuration_view == 'security:tenant_config' %}text-slate-300{% else %}text-slate-500 group-hover:text-slate-700{% endif %}"></i>
            <span>Identidad Institucional</span>
        </a>
    </nav>
</aside>

<script>if (typeof lucide !== "undefined") { lucide.createIcons(); }</script>
