<div class="bg-white border border-gray-200/80 rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1 hover:border-blue-300 hover:shadow-[0_16px_32px_rgba(37,99,235,0.05)] flex flex-col justify-between group">
    <div class="space-y-4">
        <div class="flex items-center justify-between">
            <div class="w-11 h-11 rounded-xl {{ bg_icon }} border border-gray-100 flex items-center justify-center text-blue-600 transition-transform duration-300 group-hover:scale-110">
                <i data-lucide="{{ icon }}" class="w-5 h-5"></i>
            </div>
            {% if target_count %}
                <div class="text-right">
                    <span class="block text-base font-bold text-gray-950 tracking-tight">{{ target_count }}</span>
                    <span class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest font-mono">{{ target_label }}</span>
                </div>
            {% endif %}
        </div>
        <div class="space-y-1">
            <h4 class="text-base font-bold text-gray-950 tracking-tight group-hover:text-blue-600 transition-colors">{{ title }}</h4>
            <p class="text-gray-500 text-xs leading-relaxed font-medium">{{ description }}</p>
        </div>
    </div>
    <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end">
        <a href="{{ url_destination }}" class="inline-flex items-center gap-1 text-xs font-bold uppercase tracking-wider text-blue-600 hover:text-blue-700 transition transform active:scale-95">
            {{ button_text }} <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </a>
    </div>
</div>
