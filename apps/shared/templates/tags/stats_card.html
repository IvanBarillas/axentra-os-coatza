<div class="bg-white border border-gray-200/80 p-5 rounded-2xl shadow-xs transition duration-300 hover:border-blue-300 hover:shadow-[0_12px_24px_rgba(37,99,235,0.03)] flex items-center justify-between group">
    <div class="space-y-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider font-mono block">{{ label }}</span>
        <h3 class="text-2xl font-bold tracking-tight text-gray-950 group-hover:text-blue-600 transition-colors">{{ value }}</h3>
        {% if subtext %}
            <p class="text-[11px] font-medium {% if subtext_highlight %}text-emerald-600{% else %}text-gray-400{% endif %} mt-0.5">
                {{ subtext }}
            </p>
        {% endif %}
    </div>
    <div class="w-12 h-12 rounded-xl {{ bg_icon }} border border-gray-100 flex items-center justify-center text-gray-700 transition-transform duration-300 group-hover:scale-110">
        <i data-lucide="{{ icon }}" class="w-5 h-5"></i>
    </div>
</div>
