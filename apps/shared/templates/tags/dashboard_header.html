<!-- templates/common/tags/dashboard_header.html -->
<div class="bg-white p-6 md:p-8 rounded-2xl border border-gray-200/80 shadow-2xs flex flex-col md:flex-row justify-between items-start md:items-center gap-6 select-none animate-fade-in">
    
    <!-- =========================================================================
         🏛️ BLOQUE IZQUIERDO: METADATOS Y TÍTULO DEL MÓDULO ACTIVO
         ========================================================================= -->
    <div class="space-y-1">
        <!-- Badge de Contexto Perimetral -->
        <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest font-mono bg-gray-50 text-gray-700 border border-gray-200">
            {{ badge_text }}
        </span>
        
        <!-- Título Principal con Alto Contraste para Monitores con Mucho Brillo -->
        <h2 class="text-3xl font-bold tracking-tight text-gray-950 sm:text-4xl">
            {{ title }}
        </h2>
        
        <!-- Descripción Operativa del Entorno -->
        <p class="text-sm text-gray-500 font-medium leading-relaxed max-w-3xl pt-1">
            {{ description }}
        </p>
    </div>
    
    <!-- =========================================================================
         📡 BLOQUE DERECHO: DISPARADOR DINÁMICO HTMX Y STATUS MONITOR
         ========================================================================= -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 shrink-0 w-full md:w-auto">
        
        <!-- Compuerta de Acceso a la Matriz de Permisos Dinámica -->
        {% if mostrar_permisos %}
            <a href="{% url 'security:dynamic_matrix' %}?app_slug={{ modulo_actual }}" 
               class="inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl text-[10px] uppercase tracking-wider transition-all duration-200 transform active:scale-95 shadow-2xs cursor-pointer"
               title="Gestionar matriz de privilegios JSON para el satélite: {{ modulo_actual }}">
                <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                <span>Matriz de Permisos</span>
            </a>
        {% endif %}
        
        <!-- Centinela de Estado de Sincronización del Ecosistema -->
        <div class="inline-flex items-center justify-center gap-2.5 bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl">
            <span class="relative flex h-2 w-2">
                {% if status_pulse %}
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-500 opacity-75"></span>
                {% endif %}
                <span class="relative inline-flex rounded-full h-2 w-2 bg-{{ status_color|default:'blue-600' }}"></span>
            </span>
            <span class="text-[10px] font-bold text-gray-600 uppercase tracking-widest font-mono leading-none">
                {{ status_text }}
            </span>
        </div>
        
    </div>
</div>
