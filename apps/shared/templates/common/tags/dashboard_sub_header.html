<div class="bg-white p-5 md:p-8 rounded-2xl md:rounded-[32px] border border-gray-200/80 shadow-3xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 w-full select-none animate-fade-in
    {% if border_custom %}{{ border_custom }}{% endif %}
    {% if bg_custom %}{{ bg_custom }}{% else %}bg-white{% endif %}">
    
    <div class="min-w-0 flex-1 w-full text-left">
        
        <div class="text-xs font-bold text-gray-400 font-mono uppercase tracking-[0.2em] mb-1 flex items-center gap-1.5 leading-none">
            <span class="w-1.5 h-1.5 rounded-full shrink-0 bg-{{ accent_color }}"></span>
            <span>{{ badge_text|default:"Sub-Módulo Operativo" }} // {{ modulo_actual|upper }}</span>
        </div>
        
        <h2 class="text-2xl md:text-3xl font-black text-gray-950 tracking-tighter uppercase font-mono leading-none truncate">
            {{ title }}
        </h2>
        
        {% if description %}
            <p class="hidden md:block text-xs text-gray-400 font-bold font-mono mt-1.5 uppercase tracking-wide leading-relaxed max-w-3xl">
                // {{ description }}
            </p>
        {% endif %}
    </div>
    
    <a href="{{ btn_url }}" 
       class="w-full sm:w-auto bg-gray-50 hover:bg-gray-100 text-gray-700 font-black py-3 px-5 border border-gray-200 hover:border-{{ accent_color }}/40 hover:text-{{ accent_color }} rounded-xl text-xs font-mono uppercase tracking-widest transition-all duration-150 shadow-3xs flex items-center justify-center gap-2 transform active:scale-95 whitespace-nowrap cursor-pointer shrink-0 group">
        
        {% if btn_icon %}
            <i data-lucide="{{ btn_icon }}" class="w-4 h-4 text-gray-400 transition-transform duration-150 group-hover:-translate-x-0.5"></i>
        {% endif %}
        
        <span>{{ btn_text }}</span>
    </a>
</div>
