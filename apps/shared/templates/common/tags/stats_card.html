<div class="bg-white p-4 md:p-5 rounded-2xl border border-gray-200/80 shadow-3xs transition-all duration-300 hover:border-{{ hover_color|default:'blue-600' }}/30 hover:shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 md:gap-5 group relative overflow-hidden">
    
    <div class="space-y-0.5 md:space-y-1 text-left order-2 sm:order-1 min-w-0 flex-1">
        <span class="text-xs md:text-xs font-black text-gray-400 uppercase tracking-widest font-mono block truncate">
            {{ label }}
        </span>
        
        <h3 class="text-xl md:text-2xl lg:text-3xl font-black tracking-tighter text-gray-950 transition-colors duration-200 group-hover:text-{{ hover_color|default:'blue-600' }} font-mono leading-none pt-0.5">
            {{ value }}
        </h3>
        
        {% if subtext %}
            <p class="text-xs md:text-xs font-bold font-mono uppercase tracking-wide truncate pt-1
                {% if subtext_highlight %}text-emerald-500
                {% else %}text-gray-400{% endif %}">
                // {{ subtext }}
            </p>
        {% endif %}
    </div>
    
    <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl {{ bg_icon|default:'bg-gray-50' }} border border-gray-100/80 flex items-center justify-center text-gray-700 transition-all duration-300 group-hover:bg-{{ hover_color|default:'blue-600' }} group-hover:text-white shrink-0 order-1 sm:order-2 self-start sm:self-center shadow-3xs">
        <i data-lucide="{{ icon|default:'bar-chart-3' }}" class="w-4 h-4 md:w-5 md:h-5 transition-transform duration-300 group-hover:scale-110"></i>
    </div>

</div>
