<div class="bg-white p-5 md:p-8 rounded-2xl md:rounded-[32px] border border-gray-200/80 shadow-3xs flex flex-col md:flex-row justify-between items-start md:items-center gap-4 md:gap-6 select-none animate-fade-in w-full 
    {% if border_custom %}{{ border_custom }}{% endif %} 
    {% if bg_custom %}{{ bg_custom }}{% else %}bg-white{% endif %}">
    
    <div class="flex items-start gap-4 md:gap-5 min-w-0 flex-1 w-full text-left">
        
        {% if app_icon %}
            <div class="hidden sm:flex items-center justify-center p-3.5 md:p-4 rounded-2xl border shrink-0 shadow-4xs mt-1 transition-all duration-300 
                {% if icon_bg_custom %}{{ icon_bg_custom }}{% else %}border-gray-200 bg-gray-50 text-gray-600{% endif %}">
                <i data-lucide="{{ app_icon }}" class="w-6 h-6 md:w-7 md:h-7 stroke-[2.5]"></i>
            </div>
        {% endif %}
        
        <div class="space-y-1.5 md:space-y-2 min-w-0 flex-1 w-full">
            <span class="inline-block px-2.5 py-0.5 md:px-3 md:py-1 rounded-full text-[9px] md:text-[10px] font-black uppercase tracking-[0.15em] md:tracking-widest font-mono bg-gray-50 text-gray-700 border border-gray-200 {% if badge_class %}{{ badge_class }}{% endif %}">
                {{ badge_text }}
            </span>
            
            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-black tracking-tighter text-gray-950 uppercase font-mono leading-tight truncate">
                {{ title }}
            </h2>
            
            <p class="hidden md:block text-xs md:text-sm text-gray-400 font-bold leading-relaxed max-w-3xl pt-0.5 font-mono uppercase tracking-wide">
                // {{ description }}
            </p>
        </div>
    </div>
    
    <div class="flex flex-row md:flex-col lg:flex-row items-center justify-between md:justify-start gap-2.5 shrink-0 w-full md:w-auto pt-2 md:pt-0 border-t border-dashed border-gray-100 md:border-none">
        
        {% if mostrar_permisos %}
            <a href="{% url 'security:dynamic_matrix' %}?app_slug={{ modulo_actual }}" 
               class="inline-flex items-center justify-center gap-2 bg-{{ accent_color }} hover:brightness-95 text-white font-black px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-[9px] md:text-[10px] uppercase tracking-wider transition-all duration-150 transform active:scale-95 shadow-3xs cursor-pointer whitespace-nowrap"
               title="Gestionar matriz de privilegios JSON para el satélite: {{ modulo_actual }}">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 shrink-0"></i>
                <span>Matriz Permisos</span>
            </a>
        {% endif %}
        
        <div class="inline-flex items-center justify-center gap-2 bg-gray-50/80 border border-gray-200 px-3 py-2 md:px-4 md:py-2.5 rounded-xl shrink-0">
            <span class="relative flex h-2 w-2">
                {% if status_pulse %}
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-{{ status_color }} opacity-75"></span>
                {% endif %}
                <span class="relative inline-flex rounded-full h-2 w-2 bg-{{ status_color }}"></span>
            </span>
            <span class="text-[9px] md:text-[10px] font-black text-gray-600 uppercase tracking-widest font-mono leading-none">
                {{ status_text }}
            </span>
        </div>
        
    </div>
</div>
