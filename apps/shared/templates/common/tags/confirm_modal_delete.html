<div x-show="confirmOpen" 
     x-cloak 
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/40 backdrop-blur-xs font-mono text-[11px]"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">
    
    <div @click.away="confirmOpen = false" 
         class="bg-white rounded-[24px] border border-gray-200 shadow-2xl max-w-md w-full overflow-hidden p-6 space-y-6">
        
        <div class="flex items-start gap-4">
            <div class="p-3 rounded-2xl shrink-0 {{ bg_icon }}">
                <i data-lucide="{{ icon }}" class="w-5 h-5 {{ icon_color }}"></i>
            </div>
            <div class="space-y-1 min-w-0">
                <h3 class="text-sm font-bold text-gray-950 uppercase tracking-tight" x-text="confirmTitle"></h3>
                <p class="text-gray-400 font-medium uppercase text-[10px] tracking-wide mt-1 leading-relaxed" x-text="confirmText"></p>
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
            <button @click="confirmOpen = false" type="button" class="bg-white hover:bg-gray-50 border border-gray-200 text-gray-900 font-bold py-2.5 px-4 rounded-xl uppercase tracking-wider transition cursor-pointer">
                {{ cancel_text }}
            </button>
            <button @click="executeConfirm()" type="button" class="font-bold py-2.5 px-4 rounded-xl uppercase tracking-wider transition cursor-pointer shadow-sm {{ btn_class }}">
                {{ action_text }}
            </button>
        </div>
    </div>
</div>
