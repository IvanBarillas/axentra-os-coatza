<form method="GET" 
      action="{{ action_url|default:'' }}" 
      class="bg-white p-5 rounded-2xl border border-gray-200/80 shadow-2xs space-y-4 select-none animate-fade-in"
      hx-get="{{ action_url|default:'' }}"
      hx-target="#main-content-target"
      hx-push-url="true"
      hx-indicator="#loading-spinner">
      
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-center">
        
        <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                <i data-lucide="search" class="w-4 h-4"></i>
            </span>
            <input type="text" 
                   name="q" 
                   value="{{ current_q|default:'' }}" 
                   placeholder="{{ placeholder_text|default:'Buscar por funcionario...' }}" 
                   class="w-full bg-gray-50/60 border border-gray-200 focus:border-blue-400 rounded-xl pl-10 pr-4 py-2.5 text-xs font-semibold text-gray-800 outline-none transition-all placeholder:text-gray-400"
                   hx-trigger="keyup changed delay:350ms, search">
        </div>

        <div class="relative">
            <select name="sede" 
                    class="w-full bg-gray-50/60 border border-gray-200 focus:border-blue-400 rounded-xl px-3 py-2.5 text-xs font-bold text-gray-700 outline-none transition-all cursor-pointer appearance-none"
                    hx-trigger="change">
                <option value="all">Sedes / Edificios Totales</option>
                {% for sd in sedes %}
                    <option value="{{ sd.id }}" {% if current_sede == sd.id|stringformat:"s" %}selected{% endif %}>
                        {{ sd.nombre|upper }}
                    </option>
                {% endfor %}
            </select>
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 pointer-events-none">
                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
            </span>
        </div>

        <div class="relative">
            <select name="dependencia" 
                    class="w-full bg-gray-50/60 border border-gray-200 focus:border-blue-400 rounded-xl px-3 py-2.5 text-xs font-bold text-gray-700 outline-none transition-all cursor-pointer appearance-none"
                    hx-trigger="change">
                <option value="all">Dependencias Totales</option>
                {% for dep in dependencias %}
                    <option value="{{ dep.id }}" {% if current_dep == dep.id|stringformat:"s" %}selected{% endif %}>
                        {{ dep.nombre|upper }}
                    </option>
                {% endfor %}
            </select>
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 pointer-events-none">
                <i data-lucide="building-2" class="w-3.5 h-3.5"></i>
            </span>
        </div>

    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between pt-3 border-t border-gray-100 gap-3">
        
        <div class="text-[10px] text-gray-400 font-bold font-mono uppercase tracking-wider flex items-center gap-2">
            <span class="relative flex h-1.5 w-1.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-blue-500"></span>
            </span>
            <span>Shared Filter Engine Active</span>
        </div>
        
        <div class="flex items-center gap-2 justify-end">
            {% if current_q or current_sede or current_dep %}
                <a href="{{ clear_url|default:'#' }}" 
                   class="bg-gray-50 hover:bg-gray-100 text-gray-500 font-bold text-[10px] uppercase tracking-wider py-2.5 px-4 rounded-xl transition border border-gray-200 cursor-pointer text-center"
                   hx-get="{{ clear_url|default:'#' }}"
                   hx-target="#main-content-target"
                   hx-push-url="true">
                    Limpiar Filtros
                </a>
            {% endif %}
            
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-[10px] uppercase tracking-wider py-2.5 px-5 rounded-xl transition active:scale-95 cursor-pointer shadow-2xs flex items-center gap-1.5">
                <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                <span>Filtrar Padron</span>
            </button>
        </div>
        
    </div>
</form>
