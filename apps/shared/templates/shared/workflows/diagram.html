{% if workflow_error %}
    <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">
        No fue posible cargar la guía del proceso.
    </div>
{% else %}
    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white p-4" data-ax-workflow-diagram>
        <pre class="ax-mermaid min-w-[720px] text-center">{{ workflow_mermaid }}</pre>
        <noscript>
            <p class="mt-3 text-sm text-amber-700">Activa JavaScript para visualizar el diagrama.</p>
        </noscript>
    </div>
{% endif %}
