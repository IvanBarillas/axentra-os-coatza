<form method="post" enctype="multipart/form-data" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#page-content" hx-swap="innerHTML" class="space-y-5 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="rounded-xl bg-red-50 p-4 text-sm font-bold text-red-700">{{ form.non_field_errors }}</div>{% endif %}
    <div class="grid gap-5 md:grid-cols-2">{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="{% if field.field.widget.input_type == 'textarea' %}md:col-span-2{% endif %}">{% include "inventory/partials/form_field.html" with field=field %}</div>{% endif %}{% endfor %}</div>
    <div class="flex flex-wrap justify-end gap-2">
        {% if secondary_submit_label %}<button type="submit" name="{{ submit_name }}" value="{{ secondary_submit_value }}" class="rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-black text-slate-700">{{ secondary_submit_label }}</button>{% endif %}
        <button type="submit" {% if submit_name %}name="{{ submit_name }}" value="{{ submit_value }}"{% endif %} class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-black text-white">{{ submit_label|default:"Guardar" }}</button>
    </div>
</form>
