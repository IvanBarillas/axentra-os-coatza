<form method="post" enctype="multipart/form-data" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#page-content" hx-swap="innerHTML" class="space-y-5 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">{% csrf_token %}{% if form.non_field_errors %}<div class="rounded-xl bg-red-50 p-4 text-sm font-bold text-red-700">{{ form.non_field_errors }}</div>{% endif %}<div class="grid gap-5 md:grid-cols-2">{% for field in form %}<div class="{% if field.field.widget.input_type == 'textarea' %}md:col-span-2{% endif %}">{% include "inventory/partials/form_field.html" with field=field %}</div>{% endfor %}</div><div class="flex justify-end"><button type="submit" class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-black text-white">{{ submit_label|default:"Guardar" }}</button></div></form>
