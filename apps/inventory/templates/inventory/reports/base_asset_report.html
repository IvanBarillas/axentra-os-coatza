<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Reporte patrimonial{% endblock %}</title><style>
@page{size:letter;margin:14mm}*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,sans-serif;font-size:11px}.toolbar{position:sticky;top:0;display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:#111827}.toolbar button{border:0;border-radius:7px;background:#fff;padding:9px 14px;font-weight:700;cursor:pointer}.sheet{width:216mm;min-height:279mm;margin:18px auto;background:#fff;padding:14mm;box-shadow:0 12px 35px #0f172a22}.header{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #111827;padding-bottom:12px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:2px;color:#64748b;text-transform:uppercase}h1{margin:5px 0 0;font-size:21px}h2{margin:18px 0 8px;border-bottom:1px solid #cbd5e1;padding-bottom:6px;font-size:13px}.folio{text-align:right;font-family:monospace;font-size:13px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-left:1px solid #cbd5e1;border-top:1px solid #cbd5e1}.datum{min-height:48px;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;padding:8px}.label{display:block;margin-bottom:4px;color:#64748b;font-size:8px;font-weight:800;text-transform:uppercase}.value{font-weight:700}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left;vertical-align:top}th{background:#f1f5f9;font-size:8px;text-transform:uppercase}.muted{color:#64748b}.footer{margin-top:18px;border-top:1px solid #cbd5e1;padding-top:8px;color:#64748b;font-size:8px;text-align:center}.page-break{break-before:page}@media print{body{background:#fff}.toolbar{display:none}.sheet{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}}
</style></head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Guardar como PDF</button><button onclick="window.close()">Cerrar</button></div><main class="sheet">{% block report %}{% endblock %}<footer class="footer">Documento generado por Axentra Inventory el {{ generated_at|date:"d/m/Y H:i" }}.</footer></main></body></html>
