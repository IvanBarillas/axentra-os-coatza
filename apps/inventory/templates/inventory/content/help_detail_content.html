<section class="mx-auto max-w-4xl space-y-6"><a href="{% url 'inventory:help' %}" hx-get="{% url 'inventory:help' %}" hx-target="#page-content" hx-push-url="true" class="text-sm font-black text-slate-500">← Volver al centro de ayuda</a><div class="rounded-3xl bg-slate-950 p-7 text-white"><div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/10"><i data-lucide="{{ workflow.icon }}" class="h-5 w-5"></i></div><h1 class="mt-5 text-3xl font-black">{{ workflow.title }}</h1><p class="mt-2 text-sm text-slate-300">{{ workflow.summary }}</p></div><div class="space-y-3">{% for title, description in workflow.steps %}<div class="flex gap-4 rounded-2xl border border-slate-200 bg-white p-5"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-900 text-xs font-black text-white">{{ forloop.counter }}</div><div><h2 class="font-black">{{ title }}</h2><p class="mt-1 text-sm leading-6 text-slate-500">{{ description }}</p></div></div>{% endfor %}</div><div class="rounded-2xl border border-amber-200 bg-amber-50 p-5"><p class="text-xs font-black uppercase tracking-[.18em] text-amber-700">Importante</p><p class="mt-2 text-sm font-bold leading-6 text-amber-950">{{ workflow.important }}</p></div></section>
