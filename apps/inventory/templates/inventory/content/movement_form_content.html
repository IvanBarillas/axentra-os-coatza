<section class="mx-auto max-w-5xl space-y-6">
    {% include "inventory/partials/messages.html" %}
    <div><a href="{% url 'inventory:movement_list' %}" hx-get="{% url 'inventory:movement_list' %}" hx-target="#page-content" hx-push-url="true" class="inline-flex items-center gap-2 text-sm font-black text-slate-500"><i data-lucide="arrow-left" class="h-4 w-4"></i>Volver a movimientos</a><p class="mt-5 text-xs font-black uppercase tracking-[.24em] text-slate-400">Operación patrimonial</p><h1 class="mt-2 text-2xl font-black">{{ form_title }}</h1><p class="mt-1 text-sm text-slate-500">La operación actualiza la ubicación vigente y genera un evento inmutable en el expediente.</p></div>
    {% include "inventory/partials/generic_form.html" with submit_label="Registrar movimiento" %}
</section>
<script>
(() => {
    const site = document.getElementById('id_destination_site_id') || document.getElementById('id_site_id');
    const department = document.getElementById('id_destination_department_id') || document.getElementById('id_department_id');
    const area = document.getElementById('id_destination_area_id') || document.getElementById('id_area_id');
    const user = document.getElementById('id_destination_custodian_id') || document.getElementById('id_user_id');
    if (!site || !department || site.dataset.movementReady === 'true') return;
    site.dataset.movementReady = 'true';
    const endpoint = "{% url 'inventory:movement_directory_options' %}";
    const fill = (field, options, placeholder) => {
        if (!field) return;
        const old = field.value;
        field.replaceChildren(new Option(placeholder, ''));
        options.forEach(({value,label}) => field.add(new Option(label,value)));
        if ([...field.options].some(option => option.value === old)) field.value = old;
    };
    const refresh = async () => {
        const params = new URLSearchParams({site_id:site.value, department_id:department.value});
        const response = await fetch(`${endpoint}?${params}`, {headers:{'X-Requested-With':'XMLHttpRequest'}, credentials:'same-origin'});
        if (!response.ok) return;
        const data = await response.json();
        fill(department, data.department_choices, '--- Seleccione dependencia ---');
        fill(area, data.area_choices, '--- Seleccione área ---');
        fill(user, data.user_choices, '--- Seleccione resguardatario ---');
    };
    site.addEventListener('change', () => { department.value=''; if(area) area.value=''; if(user) user.value=''; refresh(); });
    department.addEventListener('change', () => { if(area) area.value=''; if(user) user.value=''; refresh(); });
})();
</script>
