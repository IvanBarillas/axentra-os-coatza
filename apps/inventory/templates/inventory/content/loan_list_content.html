<section class="space-y-6"><div><p class="text-xs font-black uppercase tracking-[.24em] text-slate-400">Custodia temporal</p><h1 class="mt-2 text-2xl font-black">Préstamos</h1></div><div class="grid gap-4">{% for loan in loans %}<a href="{% url 'inventory:loan_detail' loan.id %}" class="flex justify-between rounded-2xl border border-slate-200 bg-white p-5"><div><p class="font-mono text-sm font-black">{{ loan.folio }}</p><p class="mt-1 font-bold">{{ loan.asset }}</p><p class="text-xs text-slate-500">{{ loan.borrower_name_snapshot }}</p></div><div class="text-right"><span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black">{{ loan.get_status_display }}</span><p class="mt-2 text-xs text-slate-500">Vence {{ loan.due_at|date:"d/m/Y H:i" }}</p></div></a>{% empty %}{% include "inventory/partials/empty_state.html" %}{% endfor %}</div></section>
