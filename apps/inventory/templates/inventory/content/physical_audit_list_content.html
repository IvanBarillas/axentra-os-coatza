<section class="space-y-6"><div><p class="text-xs font-black uppercase tracking-[.24em] text-slate-400">Verificación anual</p><h1 class="mt-2 text-2xl font-black">Auditorías físicas</h1></div><div class="grid gap-4">{% for session in audit_sessions %}<a href="{% url 'inventory:physical_audit_detail' session.id %}" class="flex justify-between rounded-2xl border border-slate-200 bg-white p-5"><div><p class="font-mono text-sm font-black">{{ session.folio }}</p><p class="mt-1 font-black">{{ session.name }}</p><p class="text-xs text-slate-500">{{ session.dependencia|default:"Alcance general" }}</p></div><span class="h-fit rounded-full bg-slate-100 px-3 py-1 text-xs font-black">{{ session.get_status_display }}</span></a>{% empty %}{% include "inventory/partials/empty_state.html" %}{% endfor %}</div></section>
